<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Manga Reader PRO — OCR Стенд (серверный CRNN)</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#121212;--surface:#1e1e1e;--primary:#4CAF50;--secondary:#2196F3;--text:#e0e0e0;--muted:#888;--border:#333;--warn:#ff9800;--bad:#f44336}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.header{background:var(--surface);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:13px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
select,.btn,label.button{padding:9px 12px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;touch-action:manipulation;white-space:nowrap}
select{background:var(--surface);border:1px solid #555;max-width:220px}
.btn.secondary{background:var(--secondary)}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{padding:5px 12px;font-size:12px;color:var(--muted);flex-shrink:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main{flex:1;display:flex;overflow:hidden}
.viewer{flex:1;position:relative;overflow:auto;background:#000;display:flex;align-items:flex-start;justify-content:center;padding:6px}
canvas{max-width:100%;height:auto;outline:1px solid var(--border)}
.nav{position:absolute;top:45%;z-index:4;padding:14px 10px;font-size:22px;background:rgba(30,30,30,.7);border:none;color:#fff;border-radius:8px;cursor:pointer}
.nav.left{left:6px}.nav.right{right:6px}
.right{width:min(460px,58vw);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.lines{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg);border-left:3px solid var(--primary);border-radius:6px;padding:8px;font-size:14px}
.card .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px;gap:6px}
.card.hit{border-left-color:var(--primary)}.card.close{border-left-color:var(--warn)}.card.miss{border-left-color:var(--bad)}
.card .gt{font-size:12px;color:var(--warn);margin-top:3px}
.summary{background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);font-size:13px;line-height:1.6;max-height:45%;overflow-y:auto}
.summary b{color:var(--primary)}
table.results{width:100%;border-collapse:collapse;font-size:11.5px}
table.results td,th{border:1px solid var(--border);padding:3px 5px;text-align:center}
table.results th{color:var(--secondary)}
.progress{width:100%;height:4px;background:var(--border);overflow:hidden;flex-shrink:0}
.pfill{height:100%;background:var(--primary);width:0%;transition:width .2s}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:var(--secondary);animation:sp 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}
.pageinfo{font-size:12px;color:var(--muted)}
@media(max-width:700px){.right{width:100vw;position:fixed;inset:6px;z-index:9;border:1px solid var(--border);border-radius:10px;display:none}.right.open{display:flex}.header h1{max-width:100%}}
</style>
</head>
<body>
<div class="header">
    <h1 id="titleHead">📚 Manga Reader — OCR (наш сервер)</h1>
    <label class="button" for="filePick">📁 Открыть .cbz/.zip/картинку</label><input type="file" id="filePick" accept=".cbz,.zip,image/*">
    <select id="modePick">
        <option value="vertical">⬇ Вебтун</option>
        <option value="rtl">🔄 Справа (Манга)</option>
        <option value="ltr">➡ Слева (Комикс)</option>
    </select>
    <span class="pageinfo" id="pageInfo"></span>
    <select id="modelPick" title="Модель"></select>
    <select id="screenPick" title="Тест-скрин"></select>
    <button class="btn secondary" id="btnOcr" disabled>🔍 OCR страницы</button>
    <button class="btn outline" id="btnAll" disabled>🏁 Все 20</button>
    <button class="btn outline" id="btnPanel">📋</button>
</div>
<div class="progress"><div class="pfill" id="pfill"></div></div>
<div class="status" id="status">Загружаю список моделей с сервера…</div>
<div class="main">
    <div class="viewer" id="viewer">
        <button class="nav left" id="btnPrev">◀</button>
        <canvas id="cv"></canvas>
        <button class="nav right" id="btnNext">▶</button>
    </div>
    <div class="right" id="panel">
        <div class="panel-head"><strong>Строки страницы</strong><span id="liner">—</span></div>
        <div class="lines" id="lines"></div>
        <div class="summary" id="summary"></div>
    </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const MAX_DIM = 1400;
let pages = [], pageIdx = 0, currentName = "", busy = false, GT = null, testKey = null, hasImg = false;
function status(t){ $('status').innerHTML = t; }
function frac(f){ $('pfill').style.width = (f*100).toFixed(0)+'%'; }
function norm(s){ s = s.normalize('NFKC').toLowerCase().replaceAll('ё','е'); return s.replace(/[^0-9a-zа-я]+/gu,''); }
function lev(a,b){ if(a.length<b.length){const t=a;a=b;b=t;} let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur.push(Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]!==b[j-1])));prev=cur;} return prev[b.length]; }
function bestWindow(gtN, hypN){ let best={sim:0,idx:-1}; if(!hypN.length)return best;
  for(let gi=0;gi<gtN.length;gi++){const g=gtN[gi],n=hypN.length; if(n>g.length)continue;
    for(let i=0;i<=g.length-n;i++){const sim=1-lev(hypN,g.slice(i,i+n))/n; if(sim>best.sim)best={sim,idx:gi};}}
  return best; }
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ---------- init ---------- */
fetch('/api/models').then(r=>r.json()).then(list=>{
  list.forEach(n=>{const o=document.createElement('option');o.value=n;
    o.textContent = n.replace('best_','').replace('.onnx','') + (n.includes('sp_distill')?' 🏆':'');
    if(n==='best_sp_distill.onnx')o.selected=true;
    $('modelPick').appendChild(o);});
  status('✅ Сервер жив. Откройте .cbz/картинку или выберите тест-скрин');
  $('btnOcr').disabled=false; $('btnAll').disabled=false;
}).catch(()=>{ status('❌ Сервер не отвечает (/api/models). Нужен запущенный стенд-сервер.'); });
fetch('testset/gt20.json').then(r=>r.json()).then(j=>GT=j).catch(()=>{});
for(let i=1;i<=20;i++){const s='s'+String(i).padStart(2,'0');const o=document.createElement('option');o.value=s;o.textContent='тест '+s;$('screenPick').appendChild(o);}

$('screenPick').onchange = e=>{
  const key = e.target.value; if(!key)return;
  const im = new Image();
  im.onload = ()=>{ pages=[{name:key, url:im.src, img:im, srv:'testset/'+key}]; pageIdx=0; showCurTest(im, key); };
  im.onerror = ()=>{ const i2=new Image(); i2.onload=()=>{ pages=[{name:key, url:i2.src, img:i2, srv:'testset/'+key}]; pageIdx=0; showCurTest(i2, key); }; i2.src='testset/'+key+'.jpg'; };
  im.src = 'testset/'+key+'.png';
};
function showCurTest(im,key){
  testKey = key; currentName = key;
  drawBase(im); hasImg = true; updInfo();
  status('Тест-скрин '+key+' — жмите «OCR страницы»');
}

/* ---------- cbz/zip/image ---------- */
$('filePick').onchange = async e=>{
  const f = e.target.files[0]; if(!f)return;
  status('<span class="spin"></span>Открываю '+f.name+' …');
  if(/\.(cbz|zip)$/i.test(f.name)){
    const zip = await JSZip.loadAsync(f);
    const names = Object.keys(zip.files).filter(n=>/\.(jpe?g|png|webp|gif|bmp)$/i.test(n)&&!/\/\./.test(n));
    names.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    pages = [];
    for(const n of names){
      const blob = await zip.files[n].async('blob');
      pages.push({name:n, url:URL.createObjectURL(blob)});
    }
    if(!pages.length){ status('❌ В архиве нет картинок'); return; }
    testKey = null;
    $('titleHead').textContent = '📚 '+f.name+' ('+pages.length+' стр.)';
    showPage(0);
    status('✅ '+pages.length+' страниц. Листайте ◀ ▶, жмите «OCR страницы»');
  } else {
    const im = new Image();
    im.onload = ()=>{ pages=[{name:f.name,url:im.src}]; pageIdx=0; testKey=null; drawBase(im); hasImg=true; updInfo(); };
    im.src = URL.createObjectURL(f);
    status('Картинка открыта — жмите «OCR страницы»');
  }
};
function updInfo(){ $('pageInfo').textContent = pages.length>1?('стр. '+(pageIdx+1)+'/'+pages.length):''; }
function showPage(i){
  if(!pages.length)return;
  pageIdx = (i+pages.length)%pages.length;
  const p = pages[pageIdx];
  if(p.img){ testKey=p.srv&&/^s\d\d$/.test(p.srv.split('/')[1])?p.srv.split('/')[1]:null; drawBase(p.img); hasImg=true; updInfo(); return; }
  const im = new Image();
  im.onload = ()=>{ p.img=im; testKey=null; drawBase(im); hasImg=true; $('viewer').scrollTop=0; updInfo(); };
  im.src = p.url;
}
function step(d){ if(pages.length<2)return; const rtl=$('modePick').value==='rtl'; showPage(pageIdx+(rtl?-d:d)); }
$('btnPrev').onclick=()=>step(-1);
$('btnNext').onclick=()=>step(1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1); });
$('btnPanel').onclick = ()=>$('panel').classList.toggle('open');

function drawBase(im, boxes){
  const c = $('cv');
  const sc = Math.min(1, MAX_DIM/Math.max(im.width, im.height));
  const W = Math.max(1,Math.round(im.width*sc)), H = Math.max(1,Math.round(im.height*sc));
  c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(im,0,0,W,H);
  if(boxes){ g.lineWidth=2;
    for(const b of boxes){ g.strokeStyle = b.cls==='hit'?'#4CAF50':(b.cls==='close'?'#ff9800':'#2196F3'); g.strokeRect(b.x,b.y,b.w,b.h); }
  }
  return {g,W,H};
}

/* ---------- OCR через сервер ---------- */
async function ocrServer(){
  const dataurl = $('cv').toDataURL('image/png');
  const r = await fetch('/api/ocr', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({img:dataurl, name:currentName, model:$('modelPick').value})});
  if(!r.ok) throw new Error('server '+r.status);
  return r.json();
}

$('btnOcr').onclick = async ()=>{
  if(busy||!hasImg)return; busy=true; $('btnOcr').disabled=true;
  try{
    status('<span class="spin"></span>ОCR на сервере ('+$('modelPick').value+') …'); frac(0.4);
    const t0 = performance.now();
    const resp = await ocrServer();
    if(resp.error) throw new Error(resp.error);
    frac(1);
    renderResults(resp.lines, ((performance.now()-t0)/1000).toFixed(1));
  }catch(e){ status('❌ '+e.message); }
  busy=false; $('btnOcr').disabled=false;
};

function renderResults(lines, took){
  const gtLines = (GT&&testKey&&GT[testKey])?GT[testKey]:null;
  const gtN = gtLines?gtLines.map(norm):null;
  let hits=0,soft=0,softN=0;
  for(const r of lines){
    r.sim=null; r.cls='miss';
    if(gtN){const bw=bestWindow(gtN,norm(r.text)); r.sim=bw.sim;
      r.cls = r.sim>=0.999?'hit':(r.sim>=0.75?'close':'miss');
      if(r.sim>=0.999)hits++;
      if(norm(r.text).length>=3){soft+=r.sim;softN++;}
    }
  }
  const {W,H}=drawBase(pages[pageIdx]&&pages[pageIdx].img || $('cv').img || currentImage(), lines);
  const el=$('lines'); el.innerHTML='';
  $('liner').textContent=lines.length+' строк';
  for(const r of lines){
    const d=document.createElement('div'); d.className='card '+(r.sim!=null?r.cls:'');
    d.innerHTML='<div class="meta"><span>['+r.x+','+r.y+' '+r.w+'×'+r.h+'] pol'+r.pol+'</span><span>conf '+r.conf.toFixed(2)+(r.sim!=null?' · sim '+r.sim.toFixed(2):'')+'</span></div><div>'+esc(r.text)+'</div>'
      +(r.sim!=null&&r.sim<0.999&&gtLines?'<div class="gt">GT ближ.: '+esc(nearestGT(r.text,gtLines))+'</div>':'');
    el.appendChild(d);
  }
  const acc = gtLines?`<br>GT-попадания: <b>${hits}/${gtLines.length}</b>, SOFT≈${softN?(soft/softN*100).toFixed(0):0}%`:'';
  $('summary').innerHTML=`<b>${$('modelPick').value}</b><br>${currentName}: ${lines.length} строк за ${took||'—'}с${acc}`;
  $('panel').classList.add('open');
  status('✅ '+currentName+': '+lines.length+' строк'+(gtLines?`, GT ${hits}/${gtLines.length}`:'')+' за '+(took||'?')+'с');
}
function nearestGT(t,gtLines){
  let best=null,bs=0;
  for(const g of gtLines){const s=1-lev(norm(t),norm(g))/Math.max(1,norm(g).length); if(s>bs){bs=s;best=g;}}
  return (best&&bs>0.3)?best+' ('+bs.toFixed(2)+')':'—';
}
function currentImage(){
  const c=$('cv'); const im=new Image(); im.width=c.width; im.height=c.height;
  return c; // fallback — рисуем на самом canvas
}

/* ---------- пакет «все 20» ---------- */
$('btnAll').onclick = async ()=>{
  if(busy)return; busy=true; $('btnAll').disabled=true; $('btnOcr').disabled=true;
  let totalHit=0,totalSoft=0,totalSoftN=0; const rows=[];
  for(let i=1;i<=20;i++){
    const key='s'+String(i).padStart(2,'0');
    status('<span class="spin"></span>Пакет '+key+' …'); frac((i-1)/20);
    try{
      const im = await loadImg('testset/'+key+'.png','testset/'+key+'.jpg');
      testKey = key; currentName = key;
      drawBase(im); hasImg = true;
      const resp = await ocrServer();
      const lines = resp.lines||[];
      const gtN = GT[key].map(norm);
      let hits=0,soft=0,softN=0;
      for(const r of lines){const bw=bestWindow(gtN,norm(r.text));
        if(bw.sim>=0.999)hits++;
        if(norm(r.text).length>=3){softN++;soft+=bw.sim;}}
      totalHit+=hits; totalSoft+=soft; totalSoftN+=softN;
      rows.push([key,hits,GT[key].length,softN?(soft/softN*100).toFixed(0):'—']);
    }catch(e){ rows.push([key,'ERR','','']); }
  }
  frac(1); testKey=null;
  const sm=(totalSoft/Math.max(1,totalSoftN)*100).toFixed(1);
  let h=`<b>${$('modelPick').value}</b><br>SCORE=<b>${(totalHit/75).toFixed(3)}</b> (${totalHit}/75) · SOFT=${sm}%<br><br><table class="results"><tr><th>скрин</th><th>hits</th><th>из</th><th>soft%</th></tr>`;
  for(const r of rows)h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
  $('summary').innerHTML=h+'</table>';
  $('panel').classList.add('open');
  status(`✅ Все 20: SCORE=${totalHit}/75, SOFT≈${sm}%`);
  busy=false; $('btnAll').disabled=false; $('btnOcr').disabled=false;
};
function loadImg(u1,u2){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>{const i2=new Image();i2.onload=()=>res(i2);i2.onerror=rej;i2.src=u2;};im.src=u1;});}
</script>
</body>
</html>
