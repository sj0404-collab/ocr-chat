<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YomiStand MONO — OCR ридер (всё внутри)</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Marck+Script&family=Bad+Script&family=Pangolin&family=Neucha&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--surface:#1e1e1e;--primary:#4CAF50;--secondary:#2196F3;--text:#e0e0e0;--muted:#888;--border:#333;--warn:#ff9800;--bad:#f44336}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.header{background:var(--surface);padding:7px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:13px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
select,.btn,label.button{padding:8px 11px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:bold;touch-action:manipulation;white-space:nowrap}
select{background:var(--surface);border:1px solid #555;max-width:210px}
.btn.secondary{background:var(--secondary)}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{padding:4px 12px;font-size:12px;color:var(--muted);flex-shrink:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main{flex:1;display:flex;overflow:hidden}
.viewer{flex:1;position:relative;overflow:auto;background:#000;display:flex;align-items:flex-start;justify-content:center;padding:6px}
.page{position:relative;display:inline-block}
canvas{display:block;outline:1px solid var(--border)}
.nav{position:fixed;top:46%;z-index:4;padding:14px 10px;font-size:22px;background:rgba(30,30,30,.7);border:none;color:#fff;border-radius:8px;cursor:pointer}
.nav.left{left:8px}.nav.right{right:8px}
.ocrbox{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.12;
        font-family:'Caveat',cursive;font-weight:700;color:#111;cursor:pointer;overflow:hidden;
        padding:2px;user-select:text;border-radius:3px;border:1.5px dashed transparent;white-space:pre-wrap;word-break:break-word}
.ocrbox:hover{border-color:var(--secondary)}
.ocrbox.hl{border-color:var(--primary);box-shadow:0 0 8px rgba(76,175,80,.5)}
.right{width:min(430px,56vw);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel-head{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.panel-head .tools{display:flex;gap:5px;flex-wrap:wrap}
.panel-head select{padding:4px 6px;font-size:11px}
.panel-head .mini{padding:5px 8px;font-size:11px}
.lines{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg);border-left:3px solid var(--primary);border-radius:6px;padding:8px;font-size:14px;cursor:pointer}
.card:hover{background:#191919}
.card .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px;gap:6px}
.card.hit{border-left-color:var(--primary)}.card.close{border-left-color:var(--warn)}.card.miss{border-left-color:var(--bad)}
.card .gt{font-size:12px;color:var(--warn);margin-top:3px}
.summary{background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);font-size:13px;line-height:1.6;max-height:42%;overflow-y:auto}
.summary b{color:var(--primary)}
table.results{width:100%;border-collapse:collapse;font-size:11.5px}
table.results td,th{border:1px solid var(--border);padding:3px 5px;text-align:center}
table.results th{color:var(--secondary)}
.progress{width:100%;height:4px;background:var(--border);overflow:hidden;flex-shrink:0}
.pfill{height:100%;background:var(--primary);width:0%;transition:width .2s}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:var(--secondary);animation:sp 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}
.pageinfo{font-size:12px;color:var(--muted)}
.font-caveat{font-family:'Caveat',cursive !important}
.font-marck{font-family:'Marck Script',cursive !important}
.font-bad{font-family:'Bad Script',cursive !important}
.font-pangolin{font-family:'Pangolin',cursive !important}
.font-neucha{font-family:'Neucha',cursive !important}
@media(max-width:700px){.right{width:100vw;position:fixed;inset:6px;z-index:9;border:1px solid var(--border);border-radius:10px;display:none}.right.open{display:flex}.header h1{max-width:100%}}
</style>
</head>
<body>
<div class="header">
    <h1 id="titleHead">📖 YomiStand MONO</h1>
    <label class="button" for="filePick">📁 .cbz/.zip/картинка</label><input type="file" id="filePick" accept=".cbz,.zip,image/*">
    <select id="modePick">
        <option value="vertical">⬇ Вебтун</option>
        <option value="rtl">🔄 Справа</option>
        <option value="ltr">➡ Слева</option>
    </select>
    <span class="pageinfo" id="pageInfo"></span>
    <select id="modelPick"></select>
    <select id="screenPick"></select>
    <button class="btn secondary" id="btnOcr" disabled>🔍 OCR</button>
    <button class="btn outline" id="btnAll" disabled>🏁</button>
    <button class="btn outline" id="btnPanel">📋</button>
</div>
<div class="progress"><div class="pfill" id="pfill"></div></div>
<div class="status" id="status"><span class="spin"></span>Готовлю встроенную модель…</div>
<div class="main">
    <div class="viewer" id="viewer">
        <div class="page" id="page"><canvas id="cv"></canvas><div id="overlay"></div></div>
    </div>
    <button class="nav left" id="btnPrev">◀</button>
    <button class="nav right" id="btnNext">▶</button>
    <div class="right" id="panel">
        <div class="panel-head">
            <strong id="liner">Строки</strong>
            <div class="tools">
                <select id="fontPick">
                    <option value="font-caveat">Caveat</option>
                    <option value="font-marck">Marck</option>
                    <option value="font-bad">Bad Script</option>
                    <option value="font-pangolin">Pangolin</option>
                    <option value="font-neucha">Neucha</option>
                    <option value="">Системный</option>
                </select>
                <select id="bgPick">
                    <option value="auto">Авто</option>
                    <option value="none">Нет</option>
                    <option value="white">Белая</option>
                    <option value="dark">Тёмная</option>
                </select>
                <button class="btn outline mini" id="btnOverlay">🅰</button>
                <button class="btn outline mini" id="btnCopy">📄</button>
            </div>
        </div>
        <div class="lines" id="lines"></div>
        <div class="summary" id="summary"></div>
    </div>
</div>
<input type="file" id="modelFilePick" accept=".onnx" style="display:none">
<script id="embeddedData" type="application/json">__EMBEDDED_JSON__</script>
<script>
"use strict";
const EMBED = JSON.parse(document.getElementById('embeddedData').textContent);
const CHARSET = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяЇїІіЄєҐґ .,!?;:\"'«»„“”()[]—–-…№*/0123456789";
const LAT = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const BLANK=109, UNK=110, LAT_OFF=111, NC=163, LINE_H=32, MAX_DIM=1400;
const GT = EMBED.gt;
const $=id=>document.getElementById(id);
let session=null, sessionName="", busy=false;
let pages=[], pageIdx=0, currentName="", testKey=null, hasImg=false;
let lastLines=[], overlayOn=true;
function status(t){$('status').innerHTML=t;}
function frac(f){$('pfill').style.width=(f*100).toFixed(0)+'%';}
function norm(s){s=s.normalize('NFKC').toLowerCase().replaceAll('ё','е');return s.replace(/[^0-9a-zа-я]+/gu,'');}
function lev(a,b){if(a.length<b.length){const t=a;a=b;b=t;}let prev=[...Array(b.length+1).keys()];
 for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur.push(Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]!==b[j-1])));prev=cur;}return prev[b.length];}
function bestWindow(gtN,hypN){let best={sim:0,idx:-1};if(!hypN.length)return best;
 for(let gi=0;gi<gtN.length;gi++){const g=gtN[gi],n=hypN.length;if(n>g.length)continue;
 for(let i=0;i<=g.length-n;i++){const sim=1-lev(hypN,g.slice(i,i+n))/n;if(sim>best.sim)best={sim,idx:gi};}}
 return best;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ---------- модели ---------- */
(function(){
  EMBED.models.forEach((m,i)=>{const o=document.createElement('option');o.value=m.name;
    o.textContent=m.name+(i===0?' 👑':''); $('modelPick').appendChild(o);});
  const of=document.createElement('option');of.value='__file__';of.textContent='📂 .onnx с устройства…';
  $('modelPick').appendChild(of);
  const oT=document.createElement('option');oT.value='';oT.textContent='тест-скрин…';$('screenPick').appendChild(oT);
  for(let i=1;i<=20;i++){const s='s'+String(i).padStart(2,'0');const o=document.createElement('option');o.value=s;o.textContent='тест '+s;$('screenPick').appendChild(o);}
})();
async function loadEmbeddedModel(name){
  const m = EMBED.models.find(x=>x.name===name) || EMBED.models[0];
  status('<span class="spin"></span>Загружаю встроенную '+m.name+' …');
  const raw = atob(m.b64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  session = await ort.InferenceSession.create(arr, {executionProviders:['wasm']});
  sessionName = m.name;
  $('btnOcr').disabled=false; $('btnAll').disabled=false;
  status('✅ Модель '+m.name+' готова — открывайте .cbz или тест-скрин');
}
$('modelPick').onchange = e=>{
  if(e.target.value==='__file__'){$('modelFilePick').click();return;}
  loadEmbeddedModel(e.target.value);
};
$('modelFilePick').onchange = async e=>{
  const f=e.target.files[0]; if(!f)return;
  session = await ort.InferenceSession.create(new Uint8Array(await f.arrayBuffer()), {executionProviders:['wasm']});
  sessionName=f.name; $('btnOcr').disabled=false; $('btnAll').disabled=false;
  status('✅ '+f.name+' загружена');
};

/* ---------- файлы: cbz/zip/image ---------- */
$('filePick').onchange = async e=>{
  const f=e.target.files[0]; if(!f)return;
  status('<span class="spin"></span>Открываю '+f.name+' …');
  if(/\.(cbz|zip)$/i.test(f.name)){
    const zip=await JSZip.loadAsync(f);
    const names=Object.keys(zip.files).filter(n=>/\.(jpe?g|png|webp|gif|bmp)$/i.test(n)&&!/\/\./.test(n));
    names.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    pages=[];
    for(const n of names){const blob=await zip.files[n].async('blob');pages.push({name:n,url:URL.createObjectURL(blob)});}
    if(!pages.length){status('❌ В архиве нет картинок');return;}
    testKey=null;
    $('titleHead').textContent='📖 '+f.name+' ('+pages.length+' стр.)';
    showPage(0);
    status('✅ '+pages.length+' страниц. ◀▶ — листать, «OCR» — прочитать');
  } else {
    const im=new Image();
    im.onload=()=>{pages=[{name:f.name,url:im.src,img:im}];pageIdx=0;testKey=null;drawBase(im);hasImg=true;updInfo();
      // авто-детект тестового скрина по имени s01..s20
      const m2=f.name.match(/s([01]\d|20)/); if(m2&&GT['s'+m2[1]])testKey='s'+m2[1];};
    im.src=URL.createObjectURL(f);
    status('Картинка открыта — жмите «OCR»');
  }
};
function updInfo(){$('pageInfo').textContent=pages.length>1?('стр. '+(pageIdx+1)+'/'+pages.length):'';}
function showPage(i){
  if(!pages.length)return;
  pageIdx=(i+pages.length)%pages.length;
  const p=pages[pageIdx];
  if(p.img){drawBase(p.img);hasImg=true;currentName=p.name;updInfo();$('viewer').scrollTop=0;return;}
  const im=new Image();
  im.onload=()=>{p.img=im;drawBase(im);hasImg=true;currentName=p.name;$('viewer').scrollTop=0;updInfo();};
  im.src=p.url;
}
function step(d){if(pages.length<2)return;const rtl=$('modePick').value==='rtl';showPage(pageIdx+(rtl?-d:d));}
$('btnPrev').onclick=()=>step(-1);
$('btnNext').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
$('btnPanel').onclick=()=>$('panel').classList.toggle('open');

/* ---------- встроенные тестовые скрины ---------- */
$('screenPick').onchange=e=>{
  const key=e.target.value; if(!key)return;
  const im=new Image();
  im.onload=()=>{pages=[{name:key,url:im.src,img:im}];pageIdx=0;testKey=key;currentName=key;drawBase(im);hasImg=true;updInfo();
    status('Скрин '+key+' — жмите «OCR»');};
  im.src=EMBED.testset[key];
};

/* ---------- отрисовка ---------- */
function drawBase(im,boxes){
  const c=$('cv');
  const sc=Math.min(1,MAX_DIM/Math.max(im.width,im.height));
  const W=Math.max(1,Math.round(im.width*sc)),H=Math.max(1,Math.round(im.height*sc));
  c.width=W;c.height=H;
  const g=c.getContext('2d');g.drawImage(im,0,0,W,H);
  const ov=$('overlay');ov.innerHTML='';
  ov.style.position='absolute';ov.style.left='0';ov.style.top='0';
  ov.style.width=W+'px';ov.style.height=H+'px';
  if(boxes){g.lineWidth=2;
    for(const b of boxes){g.strokeStyle=b.cls==='hit'?'#4CAF50':(b.cls==='close'?'#ff9800':'#2196F3');g.strokeRect(b.x,b.y,b.w,b.h);}}
  return {g,W,H,sc};
}

/* ---------- JS-сегментация (браузерная) ---------- */
function getLuma(g,W,H){
  const d=g.getImageData(0,0,W,H).data,n=W*H,lu=new Float32Array(n);
  for(let i=0;i<n;i++){const j=i*4;lu[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];}
  return lu;
}
function openMorph(m,W,H){
  const e=new Uint8Array(m.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let v=1;
    for(let dy=-1;dy<=1&&v;dy++)for(let dx=-1;dx<=1&&v;dx++){
      const yy=y+dy,xx=x+dx;if(xx<0||yy<0||xx>=W||yy>=H||!m[yy*W+xx])v=0;}
    e[y*W+x]=v;}
  const d2=new Uint8Array(m.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let v=0;
    for(let dy=-1;dy<=1&&!v;dy++)for(let dx=-1;dx<=1&&!v;dx++){
      const yy=y+dy,xx=x+dx;if(xx>=0&&yy>=0&&xx<W&&yy<H&&e[yy*W+xx])v=1;}
    d2[y*W+x]=v;}
  return d2;
}
function comps(m,W,H){
  const lab=new Int32Array(W*H).fill(-1),boxes=[];let id=0;const stack=[];
  for(let s=0;s<m.length;s++){
    if(!m[s]||lab[s]>=0)continue;
    let minx=W,maxx=0,miny=H,maxy=0,cnt=0;stack.push(s);lab[s]=id;
    while(stack.length){const p=stack.pop(),py=(p/W)|0,px=p%W;
      if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;cnt++;
      if(px>0&&m[p-1]&&lab[p-1]<0){lab[p-1]=id;stack.push(p-1);}
      if(px<W-1&&m[p+1]&&lab[p+1]<0){lab[p+1]=id;stack.push(p+1);}
      if(py>0&&m[p-W]&&lab[p-W]<0){lab[p-W]=id;stack.push(p-W);}
      if(py<H-1&&m[p+W]&&lab[p+W]<0){lab[p+W]=id;stack.push(p+W);}}
    boxes.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,a:cnt});id++;
    if(id>60000)break;}
  return boxes;
}
function linesFromBoxes(boxes,W,H){
  const hs=boxes.filter(b=>b.h>=7&&b.h<=H*0.08&&b.w>=3&&b.w<=W*0.6&&b.a>=10);
  hs.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2));
  const rows=[];
  for(const b of hs){
    let placed=false;
    for(const r of rows){
      const o=Math.min(b.y+b.h,r.y1)-Math.max(b.y,r.y0);
      if(o>0.5*Math.min(b.h,r.y1-r.y0)){r.bs.push(b);r.y0=Math.min(r.y0,b.y);r.y1=Math.max(r.y1,b.y+b.h);placed=true;break;}}
    if(!placed)rows.push({y0:b.y,y1:b.y+b.h,bs:[b]});}
  const lines=[];
  for(const r of rows){
    if(r.bs.length<2&&!(r.bs[0].w>12&&r.bs[0].h>10))continue;
    r.bs.sort((a,b)=>a.x-b.x);
    const mw=r.bs.reduce((s,b)=>s+b.w,0)/r.bs.length;
    let cx=r.bs[0].x,cx2=r.bs[0].x+r.bs[0].w,cy0=r.bs[0].y,cy1=r.bs[0].y+r.bs[0].h;
    for(let i=1;i<r.bs.length;i++){
      const b=r.bs[i],gap=b.x-cx2;
      if(gap>mw*3.2){lines.push({x:cx,y:cy0,w:cx2-cx,h:cy1-cy0});cx=b.x;cy0=b.y;cy1=b.y+b.h;}
      else{cy0=Math.min(cy0,b.y);cy1=Math.max(cy1,b.y+b.h);}
      cx2=Math.max(cx2,b.x+b.w);}
    lines.push({x:cx,y:cy0,w:cx2-cx,h:cy1-cy0});}
  return lines.filter(l=>l.w>=14&&l.h>=8);
}
function segmentJS(lu,W,H){
  const thsD=[110,140,170,200,230],thsL=[25,45,70,100,140];
  let all=[];
  for(const T of thsD){const m=new Uint8Array(W*H);for(let i=0;i<m.length;i++)if(lu[i]<T)m[i]=1;
    all=all.concat(linesFromBoxes(comps(openMorph(m,W,H),W,H),W,H).map(l=>({...l,pol:0})));}
  for(const T of thsL){const m=new Uint8Array(W*H);for(let i=0;i<m.length;i++)if(lu[i]>=T)m[i]=1;
    all=all.concat(linesFromBoxes(comps(openMorph(m,W,H),W,H),W,H).map(l=>({...l,pol:1})));}
  let s=0,n=0;for(let i=0;i<lu.length;i+=7){s+=lu[i];n++;}
  const dark=s/n<100;
  all.sort((a,b)=>(a.pol===(dark?1:0)?0:1)-(b.pol===(dark?1:0)?0:1)||a.y-b.y||a.x-b.x);
  const keep=[];
  for(const b of all){
    let dup=false;
    for(const k of keep){
      const ox=Math.max(b.x,k.x),oy=Math.max(b.y,k.y);
      const iw=Math.min(b.x+b.w,k.x+k.w)-ox,ih=Math.min(b.y+b.h,k.y+k.h)-oy;
      const inter=Math.max(0,iw)*Math.max(0,ih);
      if(inter>0.55*b.w*b.h||inter>0.55*k.w*k.h){dup=true;break;}}
    if(!dup)keep.push(b);
    if(keep.length>400)break;}
  keep.sort((a,b)=>a.y-b.y||a.x-b.x);
  return keep;
}

/* ---------- OCR строки (CRNN+CTC в браузере) ---------- */
async function ocrLine(g,W,H,b){
  const pad=2;
  const x=Math.max(0,b.x-pad),y=Math.max(0,b.y-pad);
  const w=Math.min(W,b.x+b.w+pad)-x,h=Math.min(H,b.y+b.h+pad)-y;
  if(w<4||h<4)return null;
  let newW=Math.max(8,Math.round(w*LINE_H/h));newW=Math.min(444,newW);
  const padW=Math.ceil((newW+4)/8)*8;
  const off=document.createElement('canvas');off.width=padW;off.height=LINE_H;
  const og=off.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,padW,LINE_H);
  og.drawImage($('cv'),x,y,w,h,4,0,newW,LINE_H);
  const d=og.getImageData(0,0,padW,LINE_H).data;
  const xin=new Float32Array(padW*LINE_H).fill(1);
  for(let i=0;i<padW*LINE_H;i++){const j=i*4;xin[i]=(0.299*d[j]+0.587*d[j+1]+0.114*d[j+2])/255;}
  if(b.pol)for(let i=0;i<xin.length;i++)xin[i]=1-xin[i];
  const t=new ort.Tensor('float32',xin,[1,1,LINE_H,padW]);
  const out=await session.run({x:t});
  const raw=out[Object.keys(out)[0]].data;
  const T2=padW/4;
  let prev=-2;const probs=[],chars=[];
  for(let st=0;st<T2;st++){
    const o2=st*NC;let bi=0,bv=-1e9;
    for(let k=0;k<NC;k++){const v=raw[o2+k];if(v>bv){bv=v;bi=k;}}
    if(bi===BLANK||bi===UNK){prev=bi;continue;}
    if(bi!==prev&&bi>=0){
      let c;if(bi>=LAT_OFF&&bi<NC)c=LAT[bi-LAT_OFF];else if(bi<CHARSET.length)c=CHARSET[bi];else c='�';
      chars.push(c);
      let sum=0;for(let k=0;k<NC;k++)sum+=Math.exp(raw[o2+k]-bv);
      probs.push(1/sum);}
    prev=bi;}
  const ps=[...probs].sort((a,b)=>a-b);
  const conf=ps.length?ps[ps.length>>1]:0;
  let text=chars.join('').replace(/\s+/g,' ').trim();
  while(text.includes('……'))text=text.replaceAll('……','…');
  return {text,conf};
}

/* ---------- Yomikai-оверлей ---------- */
function layoutOverlay(lines){
  const ov=$('overlay');ov.innerHTML='';
  if(!overlayOn)return;
  const fCls=$('fontPick').value,bgMode=$('bgPick').value;
  const meas=document.createElement('canvas').getContext('2d');
  const probe=document.createElement('span');probe.className=fCls;
  probe.style.position='absolute';probe.style.visibility='hidden';
  document.body.appendChild(probe);
  const fam=getComputedStyle(probe).fontFamily;probe.remove();
  for(const r of lines){
    const d=document.createElement('div');
    d.className='ocrbox '+fCls;
    d.dataset.i=r.idx;
    if(bgMode==='auto')d.style.background=r.pol?'rgba(20,20,20,0.92)':'rgba(255,255,255,0.94)';
    else if(bgMode==='white')d.style.background='rgba(255,255,255,0.94)';
    else if(bgMode==='dark')d.style.background='rgba(20,20,20,0.92)';
    else d.style.background='transparent';
    d.style.color=(bgMode==='dark'||(bgMode==='auto'&&r.pol))?'#eee':'#111';
    const bx=Math.max(0,r.x-1),by=Math.max(0,r.y-1),bw=r.w+2,bh=r.h+2;
    d.style.left=bx+'px';d.style.top=by+'px';d.style.width=bw+'px';d.style.height=bh+'px';
    let lo=6,hi=Math.max(8,bh*1.6),best=6;
    while(hi-lo>1.5){
      const fs=(lo+hi)/2;
      meas.font='700 '+fs+'px '+fam;
      if(fitText(meas,r.text,bw-4,bh-4,fs)){best=fs;lo=fs;}else{hi=fs;}
    }
    d.style.fontSize=best.toFixed(1)+'px';
    d.textContent=r.text;
    d.onclick=()=>{hlLine(r.idx);$('panel').classList.add('open');};
    ov.appendChild(d);
  }
}
function fitText(meas,text,maxW,maxH,fs){
  const words=text.split(/\s+/).filter(Boolean);
  if(!words.length)return true;
  const lh=fs*1.12;
  let lines=1,cur='';
  for(const w of words){
    const j=cur?cur+' '+w:w;
    if(meas.measureText(j).width<=maxW){cur=j;}
    else{lines++;cur=w;if(meas.measureText(w).width>maxW)return false;}
  }
  return lines*lh<=maxH;
}

/* ---------- запуск OCR ---------- */
$('btnOcr').onclick=()=>{if(pages[pageIdx]&&pages[pageIdx].img)runOcr(pages[pageIdx].img,currentName);};
async function runOcr(im,name){
  if(busy||!session)return;busy=true;$('btnOcr').disabled=true;
  const {g,W,H}=drawBase(im);
  status('<span class="spin"></span>Сегментация…');await new Promise(r=>setTimeout(r,20));
  const lu=getLuma(g,W,H);
  const boxes=segmentJS(lu,W,H);
  const gtLines=(GT&&testKey&&GT[testKey])?GT[testKey]:null;
  const gtN=gtLines?gtLines.map(norm):null;
  const results=[];let hits=0,soft=0,softN=0;
  const t0=performance.now();
  for(let i=0;i<boxes.length;i++){
    frac((i+1)/boxes.length);
    status('<span class="spin"></span>OCR строка '+(i+1)+'/'+boxes.length+' …');
    const r=await ocrLine(g,W,H,boxes[i]);
    if(!r||!r.text)continue;
    r.idx=results.length;r.sim=null;r.cls='miss';
    if(gtN){const bw=bestWindow(gtN,norm(r.text));r.sim=bw.sim;
      r.cls=r.sim>=0.999?'hit':(r.sim>=0.75?'close':'miss');
      if(r.sim>=0.999)hits++;
      if(norm(r.text).length>=3){soft+=r.sim;softN++;}}
    results.push(r);
  }
  lastLines=results;
  layoutOverlay(results);
  frac(1);
  const took=((performance.now()-t0)/1000).toFixed(1);
  const el=$('lines');el.innerHTML='';
  $('liner').textContent=results.length+' строк';
  for(const r of results){
    const d=document.createElement('div');d.className='card '+(r.sim!=null?r.cls:'');
    d.dataset.i=r.idx;
    d.innerHTML='<div class="meta"><span>['+r.x+','+r.y+' '+r.w+'×'+r.h+'] pol'+r.pol+'</span><span>conf '+r.conf.toFixed(2)+(r.sim!=null?' · sim '+r.sim.toFixed(2):'')+'</span></div><div>'+esc(r.text)+'</div>'
      +(r.sim!=null&&r.sim<0.999&&gtLines?'<div class="gt">GT ближ.: '+esc(nearestGT(r.text,gtLines))+'</div>':'');
    d.onclick=()=>hlLine(r.idx);
    el.appendChild(d);
  }
  const acc=gtLines?`<br>GT-попадания: <b>${hits}/${gtLines.length}</b>, SOFT≈${softN?(soft/softN*100).toFixed(0):0}%`:'';
  $('summary').innerHTML=`<b>${sessionName}</b><br>${name}: ${results.length} строк за ${took}с${acc}`;
  if(gtLines)$('panel').classList.add('open');
  status('✅ '+name+': '+results.length+' строк'+(gtLines?`, GT ${hits}/${gtLines.length}`:'')+' за '+took+'с');
  busy=false;$('btnOcr').disabled=false;
}
function hlLine(i){
  document.querySelectorAll('.ocrbox').forEach(e=>e.classList.remove('hl'));
  const b=document.querySelector('.ocrbox[data-i="'+i+'"]');
  if(b){b.classList.add('hl');b.parentElement.scrollTop=b.offsetTop-200;}
}
function nearestGT(t,gtLines){
  let best=null,bs=0;
  for(const g of gtLines){const s=1-lev(norm(t),norm(g))/Math.max(1,norm(g).length);if(s>bs){bs=s;best=g;}}
  return (best&&bs>0.3)?best+' ('+bs.toFixed(2)+')':'—';
}
$('fontPick').onchange=()=>layoutOverlay(lastLines);
$('bgPick').onchange=()=>layoutOverlay(lastLines);
$('btnOverlay').onclick=()=>{overlayOn=!overlayOn;layoutOverlay(lastLines);};
$('btnCopy').onclick=()=>{
  navigator.clipboard&&navigator.clipboard.writeText(lastLines.map(r=>r.text).join('\n'));
  status('📄 Скопировано '+lastLines.length+' строк');
};

/* ---------- пакет «все 20» ---------- */
$('btnAll').onclick=async()=>{
  if(busy||!session)return;busy=true;$('btnAll').disabled=true;$('btnOcr').disabled=true;
  let totalHit=0,totalSoft=0,totalSoftN=0;const rows=[];
  for(let i=1;i<=20;i++){
    const key='s'+String(i).padStart(2,'0');
    status('<span class="spin"></span>Пакет '+key+' …');frac((i-1)/20);
    try{
      const im=await new Promise(r_=>{const t=new Image();t.onload=()=>r_(t);t.src=EMBED.testset[key];});
      const {g,W,H}=drawBase(im);
      const lu=getLuma(g,W,H);
      const boxes=segmentJS(lu,W,H);
      const gtN=GT[key].map(norm);
      let hits=0,soft=0,softN=0;
      for(let bi=0;bi<boxes.length;bi++){
        const r=await ocrLine(g,W,H,boxes[bi]);
        if(!r||!r.text)continue;
        const bw=bestWindow(gtN,norm(r.text));
        if(bw.sim>=0.999)hits++;
        if(norm(r.text).length>=3){softN++;soft+=bw.sim;}
      }
      totalHit+=hits;totalSoft+=soft;totalSoftN+=softN;
      rows.push([key,hits,GT[key].length,softN?(soft/softN*100).toFixed(0):'—']);
    }catch(e){rows.push([key,'ERR','','']);}
  }
  frac(1);
  const sm=(totalSoft/Math.max(1,totalSoftN)*100).toFixed(1);
  let h=`<b>${sessionName}</b><br>SCORE=<b>${(totalHit/75).toFixed(3)}</b> (${totalHit}/75) · SOFT=${sm}%<br><br><table class="results"><tr><th>скрин</th><th>hits</th><th>из</th><th>soft%</th></tr>`;
  for(const r of rows)h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
  $('summary').innerHTML=h+'</table>';
  $('panel').classList.add('open');
  status(`✅ Все 20: SCORE=${totalHit}/75, SOFT≈${sm}%`);
  busy=false;$('btnAll').disabled=false;$('btnOcr').disabled=false;
};

loadEmbeddedModel(EMBED.models[0].name);
