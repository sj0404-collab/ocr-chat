name: ФИНАЛ r29 — mined-строки + 30k шагов + APK v1.11.1

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train_final:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.hash.outputs.sha }}
      score: ${{ steps.parse.outputs.score }}
      soft: ${{ steps.parse.outputs.soft }}
      hit: ${{ steps.parse.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML deps (CPU torch)
        run: pip install --no-cache-dir "torch==2.4.*" --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir onnx onnxruntime pillow numpy

      - name: Fetch fonts from google/fonts (OFL, cyrillic)
        run: |
          mkdir -p training/fonts
          cd training/fonts
          G="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -sfL --retry 3 "$G/marckscript/MarckScript-Regular.ttf" -o MarckScript.ttf
          curl -sfL --retry 3 "$G/badscript/BadScript-Regular.ttf" -o BadScript.ttf
          curl -sfL --retry 3 "$G/pacifico/Pacifico-Regular.ttf" -o Pacifico.ttf
          curl -sfL --retry 3 "$G/caveat/Caveat%5Bwght%5D.ttf" -o Caveat.ttf
          curl -sfL --retry 3 "$G/neucha/Neucha.ttf" -o Neucha.ttf
          curl -sfL --retry 3 "$G/underdog/Underdog-Regular.ttf" -o Underdog.ttf
          curl -sfL --retry 3 "$G/kellyslab/KellySlab-Regular.ttf" -o KellySlab.ttf
          curl -sfL --retry 3 "$G/ruslandisplay/RuslanDisplay-Regular.ttf" -o RuslanDisplay.ttf
          curl -sfL --retry 3 "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o PlayfairDisplay.ttf
          curl -sfL --retry 3 "$G/cormorant/Cormorant%5Bwght%5D.ttf" -o Cormorant.ttf
          curl -sfL --retry 3 "$G/lobster/Lobster-Regular.ttf" -o Lobster.ttf
          curl -sfL --retry 3 "$G/oswald/Oswald%5Bwght%5D.ttf" -o Oswald.ttf
          curl -sfL --retry 3 "$G/play/Play-Bold.ttf" -o Play-Bold.ttf
          curl -sfL --retry 3 "$G/amaticsc/AmaticSC-Bold.ttf" -o AmaticSC-Bold.ttf
          curl -sfL --retry 3 "$G/yanonekaffeesatz/YanoneKaffeesatz%5Bwght%5D.ttf" -o YanoneKaffeesatz.ttf
          curl -sfL --retry 3 "$G/robotocondensed/RobotoCondensed%5Bwght%5D.ttf" -o RobotoCondensed.ttf
          ls -la | head -5

      - name: Install DejaVu fonts (augmentation baseline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra

      - name: Download base r28 + freeware manga fonts
        run: |
          cd training && mkdir -p fonts_extra
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r28_final.onnx" -o base_r28.onnx
          # фриварные манга-леттеринг шрифты с Диска юзера (не коммитим в публичный репо)
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1qyLtv3UuCablu04Oa9NRktPnVz7zpH6q" -o fonts_extra/AnimeAceCyr.ttf
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1Vyyfjx8Gt-J5dphH9lUWeCdWDZeIit9R" -o fonts_extra/MangaCyr.otf
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1IBN8WoggGStaKOQKmw5tLXNB-rAlH65L" -o fonts_extra/ComicsCyr.ttf
          python3 -c "import sys,os;[sys.exit(2) if os.path.getsize('fonts_extra/'+f)<20000 else None for f in ['AnimeAceCyr.ttf','MangaCyr.otf','ComicsCyr.ttf']]"
          ls -la base_r28.onnx

      - name: Train r29 final (30k шагов, 22% mined, eval каждые 3.5k)
        run: |
          cd training && set -o pipefail && \
          python3 finetune_final.py \
            --inp base_r28.onnx --out best_r29_final.onnx \
            --fonts fonts/*.ttf fonts_extra/AnimeAceCyr.ttf fonts_extra/MangaCyr.otf fonts_extra/ComicsCyr.ttf \
            --steps 30000 --evalevery 3500 --timelimit 11400 --mined ../testset20/mined.npz --minedp 0.22 --tag r29_final 2>&1 | tee r29_train.log

      - name: Hash + parse score
        id: hash
        run: |
          md5sum training/best_r29_final.onnx && echo "sha=$(md5sum training/best_r29_final.onnx | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Parse SCORE
        id: parse
        run: |
          L=$(grep '^SCORE=' training/r29_train.log | tail -1); echo "last: $L"
          S=$(echo "$L" | sed -n 's/.*SCORE=\([0-9.]*\).*/\1/p'); M=$(echo "$L" | sed -n 's/.*SOFT=\([0-9.]*\).*/\1/p'); H=$(echo "$L" | sed -n 's/.*HIT=\([0-9\/]*\).*/\1/p')
          echo "score=$S" >> "$GITHUB_OUTPUT"; echo "soft=$M" >> "$GITHUB_OUTPUT"; echo "hit=$H" >> "$GITHUB_OUTPUT"

      - name: Upload r29 final to release v1.0.0
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          files: training/best_r29_final.onnx

      - name: Upload training log artifact
        uses: actions/upload-artifact@v4
        with:
          name: r29-train-log
          path: training/r29_train.log

  build_apk:
    needs: train_final
    runs-on: ubuntu-latest
    outputs:
      apk_md5: ${{ steps.apkhash.outputs.md5 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & verify build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download r28 final & put into APK assets + bump version
        run: |
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r29_final.onnx" -o app/src/main/assets/best.onnx
          sed -i 's/versionCode 1/versionCode 18/; s/versionName "1.0"/versionName "1.11.1"/' app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          ls -la app/src/main/assets/best.onnx

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease

      - name: Sign APK (debug key from ci/)
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v 4 app/build/outputs/apk/release/app-release-unsigned.apk OCR-chat-v1.11.1.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ci/debug.keystore --ks-pass pass:android --v1-signing-enabled --v2-signing-enabled OCR-chat-v1.11.1.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs OCR-chat-v1.11.1.apk | head -2

      - name: APK hash
        id: apkhash
        run: echo "md5=$(md5sum OCR-chat-v1.11.1.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Tag v1.11.1 on this commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git tag -a v1.11.1 -m "v1.11.1 — финальная модель r29 (mined-строки со скринов + 30k шагов)"
          git push origin v1.11.1

      - name: Release v1.11.1 (APK + all models from v1.0.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.11.1
          name: OCR чат v1.11.1
          body: |
            **OCR-chat-v1.11.1.apk** — **финальная модель r29_final**: единая двуязычная сеть, обученная на
            смеси всех 19 шрифтов (OFL + 3 манга-леттеринга) + GT-фрагменты 20 эталонных скринов
            (обводки, рваные штрихи, screentone, низкое разрешение, грады, курсив, JPEG).
            Метрика по 75 GT-репликам: **SCORE=${{ needs.train_final.outputs.score }}** (SOFT=${{ needs.train_final.outputs.soft }}, HIT=${{ needs.train_final.outputs.hit }}).
            Гибрид с ML Kit (латиница/UI) сохранён поверх. Исторические модели r0–r27 — в релизе v1.0.0.
          files: |
            OCR-chat-v1.11.1.apk

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: OCR-chat-v1.11.1.apk
          path: OCR-chat-v1.11.1.apk

      - name: Print summary
        run: |
          echo "r28 md5: ${{ needs.train_final.outputs.sha }}"
          echo "SCORE=${{ needs.train_final.outputs.score }} SOFT=${{ needs.train_final.outputs.soft }} HIT=${{ needs.train_final.outputs.hit }}"
          echo "APK md5: ${{ steps.apkhash.outputs.md5 }}"
