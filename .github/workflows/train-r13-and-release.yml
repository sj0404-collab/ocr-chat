name: Train r25 (латиница 111→163, градиент-ауг, 1500 шагов) & APK v1.9.4 с r22

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train_r13:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML deps (CPU torch)
        run: pip install --no-cache-dir "torch==2.4.*" --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir onnx onnxruntime pillow

      - name: Fetch fonts from google/fonts (OFL, cyrillic)
        run: |
          mkdir -p training/fonts
          cd training/fonts
          G="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -sfL --retry 3 "$G/marckscript/MarckScript-Regular.ttf" -o MarckScript.ttf
          curl -sfL --retry 3 "$G/badscript/BadScript-Regular.ttf" -o BadScript.ttf
          curl -sfL --retry 3 "$G/pacifico/Pacifico-Regular.ttf" -o Pacifico.ttf
          curl -sfL --retry 3 "$G/caveat/Caveat%5Bwght%5D.ttf" -o Caveat.ttf
          curl -sfL --retry 3 "$G/neucha/Neucha.ttf" -o Neucha.ttf
          curl -sfL --retry 3 "$G/underdog/Underdog-Regular.ttf" -o Underdog.ttf
          curl -sfL --retry 3 "$G/kellyslab/KellySlab-Regular.ttf" -o KellySlab.ttf
          curl -sfL --retry 3 "$G/ruslandisplay/RuslanDisplay-Regular.ttf" -o RuslanDisplay.ttf
          curl -sfL --retry 3 "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o PlayfairDisplay.ttf
          curl -sfL --retry 3 "$G/cormorant/Cormorant%5Bwght%5D.ttf" -o Cormorant.ttf
          curl -sfL --retry 3 "$G/lobster/Lobster-Regular.ttf" -o Lobster.ttf
          curl -sfL --retry 3 "$G/oswald/Oswald%5Bwght%5D.ttf" -o Oswald.ttf
          curl -sfL --retry 3 "$G/play/Play-Bold.ttf" -o Play-Bold.ttf
          curl -sfL --retry 3 "$G/amaticsc/AmaticSC-Bold.ttf" -o AmaticSC-Bold.ttf
          curl -sfL --retry 3 "$G/yanonekaffeesatz/YanoneKaffeesatz%5Bwght%5D.ttf" -o YanoneKaffeesatz.ttf
          curl -sfL --retry 3 "$G/robotocondensed/RobotoCondensed%5Bwght%5D.ttf" -o RobotoCondensed.ttf
          ls -la

      - name: Install DejaVu fonts (augmentation baseline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra

      - name: Download r13 from release
        run: |
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r22_manga.onnx" -o training/base_r22.onnx
          ls -la training/base_r22.onnx

      - name: Train r19 (1200 steps, 25% реальные строки со скринов юзера)
        run: |
          cd training && set -o pipefail && mkdir -p fonts_extra
          # фриварные манга-леттеринг шрифты с Диска юзера (не коммитим в публичный репо)
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1qyLtv3UuCablu04Oa9NRktPnVz7zpH6q" -o fonts_extra/AnimeAceCyr.ttf
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1Vyyfjx8Gt-J5dphH9lUWeCdWDZeIit9R" -o fonts_extra/MangaCyr.otf
          curl -sfL --retry 3 "https://drive.google.com/uc?export=download&id=1IBN8WoggGStaKOQKmw5tLXNB-rAlH65L" -o fonts_extra/ComicsCyr.ttf
          python3 -c "import sys;[sys.exit(2) if __import__('os').path.getsize('fonts_extra/'+f)<20000 else None for f in ['AnimeAceCyr.ttf','MangaCyr.otf','ComicsCyr.ttf']]"
          python3 finetune_chain.py \
            --inp base_r22.onnx --out best_r25_lat.onnx \
            --font fonts_extra/AnimeAceCyr.ttf --p 0.16 \
            --prev fonts_extra/MangaCyr.otf fonts_extra/ComicsCyr.ttf fonts/YanoneKaffeesatz.ttf fonts/Oswald.ttf fonts/Play-Bold.ttf fonts/RobotoCondensed.ttf fonts/AmaticSC-Bold.ttf fonts/Underdog.ttf fonts/KellySlab.ttf fonts/RuslanDisplay.ttf \
            --steps 1500 --tag r25_lat 2>&1 | tee r25_train.log

      - name: Hash
        id: hash
        run: echo "sha=$(md5sum training/best_r21_manga_v1.onnx 2>/dev/null || md5sum training/best_r25_lat.onnx | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload r14 to release v1.0.0
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          files: training/best_r25_lat.onnx

      - name: Upload training log artifact
        uses: actions/upload-artifact@v4
        with:
          name: r25-train-log
          path: training/r25_train.log

  build_apk:
    needs: train_r13
    runs-on: ubuntu-latest
    outputs:
      apk_md5: ${{ steps.apkhash.outputs.md5 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & verify build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download r13 (from train job release upload) & put into APK assets + bump version
        run: |
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r22_manga.onnx" -o app/src/main/assets/best.onnx
          sed -i 's/versionCode 1/versionCode 14/; s/versionName "1.0"/versionName "1.9.4"/' app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease

      - name: Sign APK (debug key from ci/)
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v 4 app/build/outputs/apk/release/app-release-unsigned.apk OCR-chat-v1.9.4.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ci/debug.keystore --ks-pass pass:android --v1-signing-enabled --v2-signing-enabled OCR-chat-v1.9.4.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs OCR-chat-v1.9.4.apk | head -2

      - name: APK hash
        id: apkhash
        run: echo "md5=$(md5sum OCR-chat-v1.9.4.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Tag v1.9.4 on this commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git tag -a v1.9.4 -m "v1.9.4 — APK на r22_manga (0.731); r25_lat (+латиница, +градиент-ауг) в v1.0.0"
          git push origin v1.9.4

      - name: Release v1.9.4 (APK + all models from v1.0.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.9.4
          name: OCR чат v1.9.4
          body: |
            **OCR-chat-v1.9.4.apk** — цикл 11: встроена по-прежнему **r22_manga** (0.731/1.0 на 51 GT-строке); r25_lat (латиница в алфавите, 1500 шагов от r22) лежит в релизе v1.0.0 для проверки через кнопку 📦.
            Модели r0–r25 отдельными файлами см. в релизе v1.0.0.
          files: |
            OCR-chat-v1.9.4.apk

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: OCR-chat-v1.9.4.apk
          path: OCR-chat-v1.9.4.apk

      - name: Print summary
        run: |
          echo "r14 md5: ${{ needs.train_r13.outputs.sha }}"
          echo "APK md5: ${{ steps.apkhash.outputs.md5 }}"
