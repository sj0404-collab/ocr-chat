name: Train r14 (display fonts) & build+release APK v1.2

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train_r13:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML deps (CPU torch)
        run: pip install --no-cache-dir "torch==2.4.*" --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir onnx onnxruntime pillow

      - name: Fetch fonts from google/fonts (OFL, cyrillic)
        run: |
          mkdir -p training/fonts
          cd training/fonts
          G="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -sfL --retry 3 "$G/marckscript/MarckScript-Regular.ttf" -o MarckScript.ttf
          curl -sfL --retry 3 "$G/badscript/BadScript-Regular.ttf" -o BadScript.ttf
          curl -sfL --retry 3 "$G/pacifico/Pacifico-Regular.ttf" -o Pacifico.ttf
          curl -sfL --retry 3 "$G/caveat/Caveat%5Bwght%5D.ttf" -o Caveat.ttf
          curl -sfL --retry 3 "$G/neucha/Neucha.ttf" -o Neucha.ttf
          curl -sfL --retry 3 "$G/underdog/Underdog-Regular.ttf" -o Underdog.ttf
          curl -sfL --retry 3 "$G/kellyslab/KellySlab-Regular.ttf" -o KellySlab.ttf
          curl -sfL --retry 3 "$G/ruslandisplay/RuslanDisplay-Regular.ttf" -o RuslanDisplay.ttf
          curl -sfL --retry 3 "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o PlayfairDisplay.ttf
          curl -sfL --retry 3 "$G/cormorant/Cormorant%5Bwght%5D.ttf" -o Cormorant.ttf
          curl -sfL --retry 3 "$G/lobster/Lobster-Regular.ttf" -o Lobster.ttf
          ls -la

      - name: Install DejaVu fonts (augmentation baseline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra

      - name: Download r13 from release
        run: |
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r13_allfonts.onnx" -o training/base_r13.onnx
          ls -la training/base_r13.onnx

      - name: Train r14 (1200 steps, 7 рукописных + 4 дисплейных шрифта + DejaVu)
        run: |
          cd training && python3 finetune_chain.py \
            --inp base_r13.onnx --out best_r14_display.onnx \
            --font fonts/RuslanDisplay.ttf --p 0.18 \
            --prev fonts/MarckScript.ttf fonts/BadScript.ttf fonts/Pacifico.ttf fonts/Neucha.ttf fonts/Underdog.ttf fonts/KellySlab.ttf fonts/Caveat.ttf fonts/PlayfairDisplay.ttf fonts/Cormorant.ttf fonts/Lobster.ttf \
            --steps 1200 --tag r14_display 2>&1 | tee r14_train.log

      - name: Hash
        id: hash
        run: echo "sha=$(md5sum training/best_r14_display.onnx | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload r14 to release v1.0.0
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          files: training/best_r14_display.onnx

      - name: Upload training log artifact
        uses: actions/upload-artifact@v4
        with:
          name: r14-train-log
          path: training/r14_train.log

  build_apk:
    needs: train_r13
    runs-on: ubuntu-latest
    outputs:
      apk_md5: ${{ steps.apkhash.outputs.md5 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & verify build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download r13 (from train job release upload) & put into APK assets + bump version
        run: |
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/v1.0.0/best_r14_display.onnx" -o app/src/main/assets/best.onnx
          sed -i 's/versionCode 1/versionCode 3/; s/versionName "1.0"/versionName "1.2"/' app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease

      - name: Sign APK (debug key from ci/)
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v 4 app/build/outputs/apk/release/app-release-unsigned.apk OCR-chat-v1.2.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ci/debug.keystore --ks-pass pass:android --v1-signing-enabled --v2-signing-enabled OCR-chat-v1.2.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs OCR-chat-v1.2.apk | head -2

      - name: APK hash
        id: apkhash
        run: echo "md5=$(md5sum OCR-chat-v1.2.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Tag v1.2.0 on this commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git tag -a v1.2.0 -m "v1.2.0 — комикс-баллоны на тёмных страницах + модель r14 (дисплейные шрифты)"
          git push origin v1.2.0

      - name: Release v1.2.0 (APK + all models from v1.0.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.0
          name: OCR чат v1.2.0
          body: |
            **OCR-chat-v1.2.apk** — распознавание **комикс-баллонов** на тёмных страницах (манхва/манга в тёмных читалках: сырые однотонные блобы, строки-полосы внутри, полярная инверсия) + авто-инверсия тёмных UI из v1.1. В APK встроена **r14_display**: цепочка доучек на 7 рукописных + 4 дисплейных шрифта (Ruslan Display, Playfair, Cormorant, Lobster) + DejaVu.
            Модели r0–r14 отдельными файлами см. в релизе v1.0.0.
          files: |
            OCR-chat-v1.2.apk

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: OCR-chat-v1.2.apk
          path: OCR-chat-v1.2.apk

      - name: Print summary
        run: |
          echo "r14 md5: ${{ needs.train_r13.outputs.sha }}"
          echo "APK md5: ${{ steps.apkhash.outputs.md5 }}"
